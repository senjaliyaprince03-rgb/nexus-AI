name: Nexus Agents CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/nexus-agents/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/nexus-agents/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-agents
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.12
      
    - name: Install dependencies
      run: uv sync --all-extras --dev
      
    - name: Run tests
      run: uv run pytest tests/
