name: NexusAI Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'nexusai/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'nexusai/backend/**'

jobs:
  validate-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexusai/backend
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.11
      
    - name: Check uv.lock synchronization
      run: uv lock --check
      
    - name: Verify dependency resolution
      run: |
        uv sync
        uv pip check
