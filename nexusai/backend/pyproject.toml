[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "nexusai-backend"
version = "0.1.0"
description = "NexusAI — Multi-Agent RAG Platform Backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9", # file uploads
    # Async DB
    "motor>=3.7.0",
    "pymongo>=4.12.0",
    "mongomock>=4.3.0",
    "mongomock-motor>=0.0.36",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0", # OAuth HTTP calls
    # AI / RAG
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.15",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "sentence-transformers>=3.0.0",
    "anthropic>=0.28.0",
    "huggingface-hub>=0.24.0",
    # Document parsing
    "pymupdf>=1.24.0", # PDF
    "python-docx>=1.1.0", # Word docs
    "chardet>=5.2.0", # encoding detection for txt/csv
    # Background tasks
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # Object storage
    "aiobotocore>=2.13.0", # async S3/MinIO
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    # Observability
    "structlog>=24.2.0",
    "email-validator>=2.3.0",
    "aiosqlite>=0.22.1",
    "bcrypt==4.0.1",
    "openai>=2.38.0",
    "aiohttp>=3.9.0",
    "stripe>=12.0.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
multi-agent-hub = [
    "agno>=1.7.0",
    "duckduckgo-search>=6.2.0",
    "yfinance>=0.2.40",
    "arxiv>=2.1.3",
    "wikipedia>=1.4.0",
    "newspaper4k>=0.9.3",
    "lxml_html_clean>=0.2.2",
    "youtube_transcript_api>=0.6.2",
    "groq>=0.9.0",
    "langchain-astradb>=0.4.0",
    "langchain-groq>=0.1.9",
    "langchain-huggingface>=0.0.3",
    "cassio>=0.1.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # mongomock still calls datetime.utcnow() internally on Python 3.12+.
    # Keep the test output focused on warnings from NexusAI code.
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:mongomock.*",
    # FastAPI currently re-exports Starlette's TestClient, which warns about
    # the upstream httpx transition even when NexusAI tests use ASGITransport.
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning:fastapi\\.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
