upstream nexusai_api {
    server api:8000;
    keepalive 64;
}

# ── Rate limiting zones ───────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.nexusai.app;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size — 55 MB (slightly over 50 MB app limit for framing)
    client_max_body_size 55m;

    # ── Health check (no rate limit) ──────────────────────────────
    location /health {
        proxy_pass http://nexusai_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Auth endpoints ────────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://nexusai_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Document upload ───────────────────────────────────────────
    location /api/documents/upload {
        limit_req zone=upload_limit burst=3 nodelay;
        proxy_pass          http://nexusai_api;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── SSE endpoints (chat query, ingestion progress) ────────────
    location ~ ^/api/(chat/query|documents/.*/progress) {
        proxy_pass          http://nexusai_api;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
        proxy_set_header    Connection        "";
        chunked_transfer_encoding on;
    }

    # ── WebSocket (analytics) ─────────────────────────────────────
    location /api/analytics/ws {
        proxy_pass          http://nexusai_api;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_read_timeout  3600s;
    }

    # ── All other API routes ──────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass          http://nexusai_api;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }

    # ── API docs ──────────────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://nexusai_api;
        proxy_set_header Host $host;
    }
}
