services:
  - type: web
    name: nexusai-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://nexusai.in", "https://www.nexusai.in"]'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nexusai
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ATLAS_VECTOR_SEARCH_INDEX
        value: vector_index
