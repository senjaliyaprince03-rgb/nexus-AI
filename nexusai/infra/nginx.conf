# ══════════════════════════════════════════════════════════════════════════════
# NexusAI — production nginx reverse proxy
#
# Traffic flow:
#   Browser → nginx:443 (SSL termination)
#     /api/*          → FastAPI backend:8000  (REST + SSE + WebSocket)
#     /               → Next.js frontend:3000 (SSR pages + static assets)
#
# Key decisions documented inline throughout the file.
# ══════════════════════════════════════════════════════════════════════════════


# ── Worker processes ───────────────────────────────────────────────────────────
# auto = one worker per CPU core. Good default for proxy workloads.
worker_processes auto;

# Raise the open-file limit to handle many concurrent connections.
# Must be ≤ the OS ulimit (typically 65535 on modern Linux).
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    # Maximum simultaneous connections per worker.
    # Total capacity = worker_processes × worker_connections.
    worker_connections 4096;

    # Accept as many connections as possible per wakeup.
    # Reduces syscall overhead under high load.
    multi_accept on;

    use epoll;
}


http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    # JSON format makes logs easy to ingest into Datadog / Loki / CloudWatch.
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"referrer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;


    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;   # batch TCP packets — reduces network overhead
    tcp_nodelay        on;   # disable Nagle for low-latency streaming (SSE)
    keepalive_timeout  75s;
    keepalive_requests 1000;
    server_tokens      off;  # hide nginx version from error pages + headers


    # ── Gzip compression ───────────────────────────────────────────────────────
    # Compresses JSON API responses, HTML, JS, and CSS.
    # NOT applied to SSE streams (text/event-stream) — compression adds latency
    # to streaming and the payload is already small per-frame.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;      # 1 (fastest) – 9 (smallest). 5 is the sweet spot.
    gzip_min_length   1024;   # don't compress tiny responses
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml
        font/woff2;


    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Stored in shared memory so all worker processes share the same counters.
    # $binary_remote_addr uses 4–16 bytes vs $remote_addr's 7–15 — more
    # efficient for large zone sizes.

    # General API: 20 req/s per IP — covers browsing, document lists, etc.
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=20r/s;

    # Auth endpoints: 5 req/s per IP — brute-force protection on login/register.
    limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=5r/s;

    # Chat/query: 3 req/s per IP — LLM calls are expensive; prevents abuse.
    limit_req_zone $binary_remote_addr zone=api_chat:10m   rate=3r/s;

    # Upload: 2 req/s per IP — document ingestion is CPU/IO heavy.
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=2r/s;

    # Static assets: 100 req/s — Next.js _next/static chunks, no limit needed.
    limit_req_zone $binary_remote_addr zone=static:10m     rate=100r/s;

    limit_req_status 429;   # Return 429 Too Many Requests (not 503)


    # ── Upstream: FastAPI backend ──────────────────────────────────────────────
    # "backend" matches the docker-compose service name — resolved by Docker DNS.
    # keepalive 32: maintain 32 idle connections to the backend pool, avoiding
    # TCP handshake overhead on every proxied request.
    upstream nexusai_backend {
        server backend:8000;
        keepalive 32;
    }

    # ── Upstream: Next.js frontend ─────────────────────────────────────────────
    upstream nexusai_frontend {
        server frontend:3000;
        keepalive 16;
    }


    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name nexusai.example.com;

        # ACME challenge for Let's Encrypt certificate renewal.
        # Certbot / acme.sh writes challenge files here.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # ── HTTPS main server ──────────────────────────────────────────────────────
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;          # HTTP/2 multiplexing — faster asset loading
        server_name nexusai.example.com;

        # ── TLS certificates ───────────────────────────────────────────────────
        # Point these at your Let's Encrypt (or other CA) certificate files.
        # For Let's Encrypt:  certbot certonly --webroot -d nexusai.example.com
        ssl_certificate     /etc/letsencrypt/live/nexusai.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexusai.example.com/privkey.pem;

        # ── TLS hardening ──────────────────────────────────────────────────────
        # TLSv1.3 only would be ideal but v1.2 is still needed for older clients.
        ssl_protocols             TLSv1.2 TLSv1.3;

        # Prefer server cipher order — mitigates BEAST/POODLE.
        # Cipher suite from Mozilla's "Intermediate" recommendation.
        ssl_prefer_server_ciphers on;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

        # Session cache avoids full TLS handshake on repeat connections.
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;  # stateless tickets have forward-secrecy issues

        # OCSP stapling: nginx fetches + caches the cert revocation status
        # and sends it to the client — avoids a separate OCSP roundtrip.
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # DH params are optional here. The deployment can run without a
        # separate file-mounted parameter set; add one later if you want to
        # harden legacy DHE cipher suites further.


        # ── Security headers ───────────────────────────────────────────────────
        # Applied to every response from this server block.

        # HSTS: tell browsers to always use HTTPS for 1 year.
        # includeSubDomains + preload = eligible for browser HSTS preload list.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent MIME-type sniffing — browsers must honour Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Block page from being embedded in iframes on other origins (clickjacking).
        add_header X-Frame-Options "DENY" always;

        # Disable referrer on cross-origin navigations — don't leak the URL.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restrict browser features not used by the app.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Content-Security-Policy.
        # - default-src 'self': only load resources from the same origin by default
        # - script-src: Next.js inlines a small hydration script — 'unsafe-inline'
        #   is unavoidable without nonces. Add nonces in the Next.js app for strict CSP.
        # - connect-src: allows XHR/fetch/SSE/WebSocket to the same origin.
        # - img-src: adds MinIO presigned URL domain.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' 'unsafe-eval'; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; "
            "connect-src 'self' wss://nexusai.example.com; "
            "frame-ancestors 'none';"
            always;

        # Unique request ID — propagated to FastAPI via header for distributed tracing.
        add_header X-Request-ID $request_id always;


        # ── Client body limits ─────────────────────────────────────────────────
        # Matches the 50 MB file-size limit in app/core/file_validation.py.
        # Requests exceeding this are rejected before reaching FastAPI — saves
        # backend bandwidth and protects against naive DoS uploads.
        client_max_body_size 55M;   # slightly above app limit for multipart overhead


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: Auth endpoints — tighter rate limiting
        # ══════════════════════════════════════════════════════════════════════
        location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
            # burst=10: absorb short bursts; nodelay: serve burst immediately
            # (delay would hold connections open, wasting workers)
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass         http://nexusai_backend;
            include            /etc/nginx/proxy_params;
        }


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: Chat query — SSE streaming + tighter rate limit
        # ══════════════════════════════════════════════════════════════════════
        location = /api/chat/query {
            limit_req zone=api_chat burst=5 nodelay;

            proxy_pass         http://nexusai_backend;
            include            /etc/nginx/proxy_params;

            # ── SSE-specific settings ──────────────────────────────────────────
            # Disable response buffering: nginx must forward each token frame
            # to the client immediately as it arrives from FastAPI.
            # Without this, nginx buffers the entire response before sending —
            # the stream appears frozen until the LLM finishes.
            proxy_buffering            off;
            proxy_cache                off;

            # Send each SSE frame to the client immediately (no write coalescing).
            proxy_set_header           X-Accel-Buffering no;

            # Keep the connection open for the duration of the LLM response.
            # LLM calls can take 60–90 s for long documents.
            proxy_read_timeout         120s;
            proxy_send_timeout         120s;

            # Ensure HTTP/1.1 is used upstream — needed for chunked transfer encoding.
            proxy_http_version         1.1;
            proxy_set_header           Connection "";
        }


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: Analytics WebSocket — /api/analytics/ws
        # ══════════════════════════════════════════════════════════════════════
        location = /api/analytics/ws {
            proxy_pass         http://nexusai_backend;
            include            /etc/nginx/proxy_params;

            # WebSocket upgrade handshake.
            # Without these two headers, nginx proxies HTTP and the browser
            # gets a 426 Upgrade Required or a connection reset.
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # WebSocket connections are long-lived — set a generous timeout.
            # Client sends a ping every 30 s; 90 s gives 3 missed pings before drop.
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;

            proxy_buffering    off;
        }


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: Document upload — SSE progress stream
        # ══════════════════════════════════════════════════════════════════════
        location = /api/documents/upload {
            limit_req zone=api_upload burst=4 nodelay;

            proxy_pass         http://nexusai_backend;
            include            /etc/nginx/proxy_params;

            # Allow the full 50 MB document to be received before FastAPI starts
            # reading it. proxy_request_buffering on (the default) buffers the
            # entire request body — fine for uploads.
            proxy_request_buffering on;
            client_max_body_size    55M;

            # The upload response itself is an SSE progress stream.
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;  # large PDFs can take minutes to process
        }

        # Ingestion progress SSE for a specific document.
        location ~ ^/api/documents/[^/]+/progress$ {
            proxy_pass         http://nexusai_backend;
            include            /etc/nginx/proxy_params;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: All other /api/* — general rate limit
        # ══════════════════════════════════════════════════════════════════════
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass         http://nexusai_backend;
            include            /etc/nginx/proxy_params;
        }


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: Next.js static assets — long cache, no auth check
        # ══════════════════════════════════════════════════════════════════════
        # Next.js names static chunks with a content hash, e.g.
        # /_next/static/chunks/app-abc123.js — they are immutable.
        # One year cache means repeat visitors never re-download unchanged assets.
        location /_next/static/ {
            proxy_pass http://nexusai_frontend;
            include    /etc/nginx/proxy_params;

            # Immutable assets — cache for 1 year.
            # "immutable" tells the browser not to revalidate even on refresh.
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            # Inherit security headers from the parent server block.
            add_header X-Content-Type-Options "nosniff" always;

            limit_req  zone=static burst=200 nodelay;
        }

        # Public static files (favicon, og-image, robots.txt, etc.)
        location /public/ {
            proxy_pass http://nexusai_frontend;
            include    /etc/nginx/proxy_params;
            add_header Cache-Control "public, max-age=86400" always;
        }


        # ══════════════════════════════════════════════════════════════════════
        # ROUTE: Everything else → Next.js frontend (SSR pages)
        # ══════════════════════════════════════════════════════════════════════
        location / {
            proxy_pass         http://nexusai_frontend;
            include            /etc/nginx/proxy_params;

            # No cache for SSR pages — Next.js manages its own cache headers.
            proxy_buffering    on;
            proxy_cache        off;
        }


        # ── Health check endpoint (used by load balancers) ─────────────────────
        # Returns 200 without hitting either upstream — useful for ALB / GCP LB.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
